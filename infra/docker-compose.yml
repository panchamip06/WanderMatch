version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wandermatch-db
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../WanderMatch/data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: wandermatch-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password123@postgres:5432/travel
      - SYNC_DATABASE_URL=postgresql://postgres:password123@postgres:5432/travel
      - ENV=development
      - FIREBASE_AUTH_MOCK=True
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: wandermatch-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

volumes:
  postgres_data:
